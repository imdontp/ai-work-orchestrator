[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-work-orchestrator"
version = "0.1.0"
description = "Local-first orchestration bridge for subscription-based CLI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  # Workflow graphs are YAML. Previously present only as a transitive dependency of
  # uvicorn[standard], which is not something to rely on for a direct import.
  "pyyaml>=6.0,<7.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23,<5.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
  # mypy runs in strict mode and PyYAML ships no inline types.
  "types-PyYAML>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "orchestrator", "workers", "execution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a default is how FastAPI declares a dependency; B008 exists for
# accidental mutable defaults, which this is not.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
